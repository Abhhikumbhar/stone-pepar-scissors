<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stone Paper Scissors Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style (1).css">
</head>
<body>

<div class="container text-center mt-5">
  <h1 class="mb-4">✊ 📄 ✂ Stone Paper Scissors</h1>

  <div class="row justify-content-center mb-4">
    <div class="col-md-4">
      <h4>Your Choice</h4>
      <p id="user-choice">-</p>
    </div>
    <div class="col-md-4">
      <h4>Computer Choice</h4>
      <p id="computer-choice">-</p>
    </div>
  </div>

  <h3 id="result" class="mb-4"></h3>

  <div class="d-flex justify-content-center gap-3">
    <button class="btn btn-primary choice-btn" onclick="playGame('Stone')">✊ Stone</button>
    <button class="btn btn-success choice-btn" onclick="playGame('Paper')">📄 Paper</button>
    <button class="btn btn-danger choice-btn" onclick="playGame('Scissors')">✂ Scissors</button>
  </div>

  <div class="mt-4">
    <h5>Score</h5>
    <p>You: <span id="user-score">0</span> | Computer: <span id="computer-score">0</span></p>
  </div>
</div>

<script src="script (2).js"></script>
</body>
</html>
